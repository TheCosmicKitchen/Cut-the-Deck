<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Cut the Deck Proxies</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,700;1,400&family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a felt card table under a wood rail; work screens are cream binder pages laid on the felt. One committed look. */
:root {
  --table: #1d4a37; --felt-hi: #2a6249; --felt-lo: #12301f;
  --wood: #3a2618; --wood-hi: #5a3b24; --brass: #e0b04f; --brass-hi: #f2c867; --brass-ink: #2b1a05;
  --panel: #f6efdf; --panel-2: #ece3cd; --line: #cbbd9d; --line-2: #e0d5bb;
  --ink: #2a2118; --ink-2: #6a5b47; --chalk: #f4ecd8; --chalk-2: #c9d8c8;
  --accent: #e0b04f; --accent-bg: rgba(224,176,79,.18); --accent-ink: #2b1a05;
  --danger: #b3261e; --ok: #4caf68; --warn-bg: #fbe7b8; --warn-ink: #5a3d00;
  --paper: #fbf6ea; --paper-ink: #22201c; --paper-2: #6b6457; --paper-edge: #1a1612; --slip: #fff1b8;
  --f-display: "Bricolage Grotesque", "Avenir Next Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-ui: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-card: "Alegreya", "Iowan Old Style", Georgia, serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --shadow: 0 2px 0 rgba(0,0,0,.25), 0 14px 24px -12px rgba(0,0,0,.7);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; color: var(--chalk); font-family: var(--f-ui); font-size: 15px; line-height: 1.45;
  background-color: var(--table);
  background-image:
    radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.08), transparent 60%),
    radial-gradient(ellipse at 50% 120%, rgba(0,0,0,.45), transparent 60%),
    repeating-radial-gradient(circle at 30% 40%, rgba(255,255,255,.018) 0 1px, transparent 1px 3px),
    repeating-radial-gradient(circle at 70% 60%, rgba(0,0,0,.03) 0 1px, transparent 1px 4px);
  background-attachment: fixed; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--brass-hi); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-family: var(--f-display); }
h2 { font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
.label { font-family: var(--f-display); font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
.sub { color: var(--ink-2); margin: 0; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1480px; margin: 0 auto; }

/* header: the table's wood rail */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--wood); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: linear-gradient(180deg, var(--wood-hi), var(--wood) 70%); border-bottom: 3px solid #1f140c; box-shadow: 0 6px 16px -8px rgba(0,0,0,.7); }
header.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 22px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand b { font-family: var(--f-display); font-weight: 800; font-size: 26px; letter-spacing: -.02em; color: var(--chalk); white-space: nowrap; }
.brand b em { font-style: normal; color: var(--brass-hi); display: inline-block; transform: rotate(-8deg) translateY(1px); margin: 0 1px; }
header .packname { border: 1px solid rgba(255,255,255,.15); background: rgba(0,0,0,.2); border-radius: 999px; padding: 4px 12px; font-weight: 700; color: var(--brass-hi); width: 15ch; min-width: 0; }
header .packname:hover, header .packname:focus { background: rgba(0,0,0,.35); border-color: var(--brass); }
nav.tabs { display: flex; flex-wrap: wrap; gap: 4px; }
nav.tabs a { text-decoration: none; color: var(--chalk); font-family: var(--f-display); font-weight: 700; font-size: 16px; padding: 7px 14px; border-radius: 999px; border: 1px solid transparent; }
nav.tabs a:hover { border-color: rgba(242,200,103,.5); }
nav.tabs a[aria-current="page"] { background: var(--brass); color: var(--brass-ink); box-shadow: inset 0 -2px 0 rgba(0,0,0,.2); }
.savestate { margin-left: auto; font-size: 13px; color: var(--chalk-2); display: flex; align-items: center; gap: 6px; }
.savestate i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: inline-block; box-shadow: 0 0 8px var(--ok); }

/* buttons */
.btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 10px; padding: 7px 14px; font-weight: 700; min-height: 40px; box-shadow: 0 2px 0 rgba(0,0,0,.18); }
.btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 3px 0 rgba(0,0,0,.2); }
.btn:active:not(:disabled) { transform: translateY(1px); box-shadow: none; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: linear-gradient(180deg, var(--brass-hi), var(--brass)); color: var(--brass-ink); border-color: #a87b22; }
.btn.danger { color: var(--danger); border-color: var(--danger); }
.btn.small { min-height: 32px; padding: 3px 10px; font-size: 13px; border-radius: 8px; }
.btn.ghost { background: transparent; border-style: dashed; color: var(--ink-2); box-shadow: none; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.panel { background: var(--panel); color: var(--ink); border: 1px solid #d9cba8; border-radius: 14px; padding: 16px; min-width: 0; box-shadow: var(--shadow); }
.panel .help { color: var(--ink-2); }
input[type="text"], input[type="number"], input[type="search"], select, textarea {
  border: 1px solid var(--line); background: #fffaf0; color: var(--ink); border-radius: 8px; padding: 7px 9px; min-width: 0; }
textarea { width: 100%; resize: vertical; }

main { padding-block: 20px 180px; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); top: calc(76px + env(safe-area-inset-top, 0px)); z-index: 30; background: var(--wood); color: var(--chalk); border: 1px solid var(--brass); padding: 10px 16px; border-radius: 10px; font-weight: 700; box-shadow: var(--shadow); max-width: min(560px, calc(100vw - 32px)); }

/* ---------- cards: printed proxies with a colored frame ---------- */
.cards { display: flex; flex-wrap: wrap; gap: 12px; min-height: 60px; align-items: flex-start; }
.card { position: relative; width: 184px; padding: 6px; border-radius: 12px; box-shadow: var(--shadow); transition: transform .14s ease, box-shadow .14s ease;
  border: 1.5px solid var(--paper-edge); }
.card.enemy { width: 222px; }
.card.big { width: 280px; }
.card:hover { transform: translateY(-4px); }
.hand .card:nth-child(4n+1) { transform: rotate(-1.6deg); }
.hand .card:nth-child(4n+3) { transform: rotate(1.4deg); }
.hand .card:hover, .card.sel { transform: translateY(-8px) rotate(0); }
.card.sel { box-shadow: 0 0 0 3px var(--brass-hi), 0 0 24px 4px rgba(242,200,103,.45), var(--shadow); }
.card .face { background: var(--paper); color: var(--paper-ink); border-radius: 8px; border: 1px solid rgba(0,0,0,.35); display: flex; flex-direction: column; min-height: 252px; overflow: hidden; }
.card.big .face { min-height: 360px; }
.card .chead { display: flex; align-items: center; gap: 6px; padding: 6px 7px 5px; background: linear-gradient(180deg, #fffdf6, #efe6d2); border-bottom: 1px solid rgba(0,0,0,.2); }
.card .cname { all: unset; cursor: pointer; flex: 1; min-width: 0; font-family: var(--f-display); font-weight: 700; font-size: 15px; line-height: 1.1; overflow-wrap: anywhere; }
.card.big .cname { font-size: 19px; }
.card .cname:focus-visible { outline: 2px solid var(--brass); }
.card .cost { flex: none; min-width: 28px; height: 28px; padding: 0 6px; border-radius: 14px; display: grid; place-items: center; font-family: var(--f-mono); font-weight: 700; font-size: 14px; color: #fff;
  background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.55), transparent 45%), var(--gem, #5d636a); border: 1.5px solid rgba(0,0,0,.55); text-shadow: 0 1px 1px rgba(0,0,0,.5); }
.card .art { height: 62px; border-bottom: 1px solid rgba(0,0,0,.25); }
.card.big .art { height: 96px; }
.card .ctype { padding: 3px 8px; font-family: var(--f-display); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--paper-2); background: #f1e9d6; border-bottom: 1px solid rgba(0,0,0,.12); }
.card .ctext { padding: 8px 9px; font-family: var(--f-card); font-size: 15px; line-height: 1.45; flex: 1; display: grid; align-content: start; gap: 5px; }
.card.big .ctext { font-size: 17px; }
.card .ln.now { background: #fde9b0; border-radius: 5px; box-shadow: 0 0 0 2px #c99300; padding: 0 3px; }
.tok { all: unset; cursor: pointer; border-radius: 3px; padding: 0 1px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.tok:hover { background: #efe5cc; }
.tok:focus-visible { outline: 2px solid var(--brass); }
.tok.kw { font-weight: 700; box-shadow: inset 0 -3px 0 var(--kc); }
.tok.num { font-family: var(--f-mono); font-weight: 700; font-size: .92em; }
.tok.m { text-decoration: line-through; text-decoration-thickness: 2px; color: var(--paper-2); box-shadow: none; }
.tok.slip { background: var(--slip); outline: 1px dashed #9b8a3c; transform: rotate(-1deg); display: inline-block; }
.tok.on { background: #1f4fa8 !important; color: #fff; box-shadow: none; }
.empty-line { color: var(--paper-2); font-style: italic; font-size: 13px; }
.card .ctrs { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 8px 8px; }
.ctr { display: inline-flex; align-items: center; gap: 2px; border: 1px solid #b7a98a; border-radius: 999px; font-size: 12px; font-weight: 700; background: #f3ead3; }
.ctr b { font-family: var(--f-mono); padding: 0 2px; }
.ctr span { padding-left: 8px; }
.ctr button { border: none; background: none; padding: 2px 6px; min-width: 26px; min-height: 26px; font-weight: 700; color: var(--paper-ink); }
.ctr.hp { font-size: 14px; background: #b8322a; color: #fff; border-color: #6d1610; }
.ctr.hp button { color: #fff; }
.card .tags { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 8px 8px; }
.tag { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 1px 6px; border-radius: 999px; border: 1px solid currentColor; color: var(--paper-2); }
.tag.clash { color: #a3271c; }
.card .estep { padding: 0 8px 8px; }
.card .estep .help { color: var(--paper-2); }

/* ---------- table ---------- */
.trackers { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.trk { display: inline-flex; align-items: center; gap: 4px; background: rgba(0,0,0,.28); border: 1px solid rgba(255,255,255,.14); border-radius: 999px; padding: 4px; }
.trk .coin { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-mono); font-weight: 700; font-size: 19px; color: #fff; font-variant-numeric: tabular-nums;
  background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.5), transparent 45%), var(--coin, #3d7f88); border: 2px solid rgba(0,0,0,.45); box-shadow: inset 0 -3px 0 rgba(0,0,0,.25); text-shadow: 0 1px 2px rgba(0,0,0,.6); }
.trk span { font-family: var(--f-display); font-weight: 700; padding: 0 4px 0 8px; font-size: 14px; color: var(--chalk); }
.trk button { border: none; background: rgba(255,255,255,.12); color: var(--chalk); border-radius: 50%; width: 32px; height: 32px; font-weight: 700; font-size: 16px; }
.trk button:hover { background: rgba(255,255,255,.22); }
.turnpill { font-family: var(--f-display); font-weight: 800; font-size: 15px; color: var(--brass-hi); padding: 6px 12px; border: 1px dashed rgba(242,200,103,.6); border-radius: 999px; }
.tablegrid { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start; margin-top: 16px; }
.tablemain { flex: 999 1 640px; min-width: 0; display: grid; gap: 16px; }
.tableside { flex: 1 1 280px; min-width: 0; display: grid; gap: 14px; }
.zone { border: 2px dashed rgba(244,236,216,.28); border-radius: 16px; padding: 12px; min-width: 0; background: rgba(0,0,0,.12); }
.zone.over { border-color: var(--brass-hi); background: rgba(242,200,103,.12); }
.zone > .zh { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; margin-bottom: 10px; }
.zone > .zh .label { color: var(--brass-hi); font-size: 14px; }
.zone .hint, .zone > .help, .zone .cards > .help { font-size: 13px; color: var(--chalk-2); font-style: italic; }
.zone.handzone { background: linear-gradient(180deg, rgba(0,0,0,.05), rgba(0,0,0,.25)); }
.pile { display: grid; gap: 10px; justify-items: start; }
.pile .zh { margin: 0; }
.stack { position: relative; width: 92px; height: 124px; }
.stack i { position: absolute; inset: 0; border-radius: 9px; border: 1.5px solid #120c07;
  background: radial-gradient(circle at 50% 50%, rgba(242,200,103,.55) 0 12%, transparent 13%), repeating-linear-gradient(45deg, #5a1f1f 0 7px, #451616 7px 14px); box-shadow: 0 2px 0 rgba(0,0,0,.3); }
.stack i:nth-child(1) { transform: translate(6px, 6px); }
.stack i:nth-child(2) { transform: translate(3px, 3px); }
.stack.disc i { background: var(--paper); }
.stack.disc i:last-child { display: grid; place-items: center; padding: 6px; text-align: center; font-family: var(--f-display); font-weight: 700; font-size: 13px; color: var(--paper-ink); }
.stack.empty i { background: transparent; border: 2px dashed rgba(244,236,216,.3); box-shadow: none; }
.stack b { position: absolute; right: -10px; bottom: -10px; z-index: 2; min-width: 34px; height: 34px; padding: 0 6px; border-radius: 17px; display: grid; place-items: center; background: var(--brass); color: var(--brass-ink); font-family: var(--f-mono); font-weight: 700; border: 2px solid #1f140c; }
.minilist { display: grid; gap: 4px; max-height: 220px; overflow: auto; }
.minilist button { text-align: left; border: 1px solid var(--line-2); background: #fffaf0; border-radius: 8px; padding: 6px 9px; font-size: 14px; }
.clips { display: flex; flex-wrap: wrap; gap: 6px; }
.clip { display: inline-flex; align-items: center; border-radius: 4px; background: var(--slip); color: var(--paper-ink); font-family: var(--f-card); font-weight: 700; font-size: 15px; border: 1px solid #b9a660; box-shadow: 0 2px 0 rgba(0,0,0,.15); }
.clip:nth-child(odd) { transform: rotate(-1.5deg); }
.clip:nth-child(even) { transform: rotate(1deg); }
.clip button { border: none; background: none; color: inherit; padding: 5px 8px; min-height: 34px; }
.clip .x { padding: 5px 7px; color: var(--paper-2); font-family: var(--f-ui); }
.clip.on { outline: 3px solid #1f4fa8; }
.clip.kw { box-shadow: inset 0 -4px 0 var(--kc), 0 2px 0 rgba(0,0,0,.15); }
.log { font-size: 13px; color: var(--ink-2); display: grid; gap: 3px; max-height: 200px; overflow: auto; }
.newgame { border: 2px solid var(--brass); }
.checks { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.checks label { display: inline-flex; gap: 6px; align-items: center; min-height: 34px; }

/* ---------- edit bar: a wood tray along the bottom ---------- */
#editbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; color: var(--chalk);
  background: linear-gradient(180deg, var(--wood-hi), var(--wood)); border-top: 3px solid var(--brass);
  padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); padding-top: 10px; box-shadow: 0 -10px 24px -10px rgba(0,0,0,.7); }
#editbar .wrap { display: grid; gap: 8px; }
#editbar .what { font-size: 14px; color: var(--chalk-2); }
#editbar .what b { color: var(--brass-hi); }
#editbar .grp { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
#editbar .help { color: var(--chalk-2); }
#editbar .sep { width: 1px; align-self: stretch; background: rgba(255,255,255,.2); margin: 0 4px; }

/* ---------- library ---------- */
.libgrid { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start; }
.liblist { flex: 1 1 280px; max-width: 360px; min-width: 0; }
.libform { flex: 999 1 420px; min-width: 0; display: grid; gap: 14px; }
.libprev { flex: 1 1 290px; min-width: 0; display: grid; gap: 12px; justify-items: start; }
.libprev > .label { color: var(--brass-hi); }
.items { display: grid; gap: 4px; max-height: 640px; overflow: auto; margin-top: 8px; }
.item { display: flex; align-items: center; gap: 8px; text-align: left; border: 1px solid transparent; background: transparent; border-radius: 10px; padding: 6px 8px; min-height: 46px; width: 100%; }
.item:hover { background: var(--panel-2); }
.item.on { border-color: var(--ink); background: #fffaf0; box-shadow: 0 2px 0 rgba(0,0,0,.12); }
.item .nm { flex: 1; min-width: 0; font-family: var(--f-display); font-weight: 700; }
.item .meta { font-size: 12px; color: var(--ink-2); font-family: var(--f-mono); }
.dots { display: inline-flex; gap: 2px; }
.dots i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; border: 1px solid rgba(0,0,0,.35); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: #fffaf0; border-radius: 999px; padding: 4px 11px; font-size: 13px; font-weight: 700; min-height: 34px; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.chip i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; border: 1px solid rgba(0,0,0,.3); }
.field { display: grid; gap: 4px; min-width: 0; }
.field label, .field .lab { font-size: 13px; font-weight: 700; color: var(--ink-2); }
.fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.help { font-size: 13px; color: var(--ink-2); }
.warn { background: var(--warn-bg); color: var(--warn-ink); border-radius: 10px; padding: 9px 11px; font-size: 14px; border: 1px solid #e3c37a; }
.warn a { color: inherit; font-weight: 700; }

/* ---------- keywords ---------- */
.kwgrid { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start; }
.kwmain { flex: 999 1 640px; min-width: 0; display: grid; gap: 16px; }
.kwside { flex: 1 1 300px; min-width: 0; display: grid; gap: 16px; }
.tblwrap { overflow-x: auto; }
table.kw { border-collapse: collapse; width: 100%; min-width: 760px; }
table.kw th { text-align: left; font-family: var(--f-display); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); padding: 6px; border-bottom: 2px solid var(--line); }
table.kw td { padding: 4px 6px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
table.kw input, table.kw select { width: 100%; }
table.kw td.n { font-family: var(--f-mono); font-size: 13px; color: var(--ink-2); padding-top: 12px; text-align: right; }
.ring { position: relative; width: 260px; height: 260px; margin: 8px auto; max-width: 100%; }
.ring .dot { position: absolute; width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; text-align: center; font-family: var(--f-display); font-weight: 800; font-size: 14px; border: 2px solid rgba(0,0,0,.45); padding: 4px; overflow-wrap: anywhere;
  box-shadow: inset 0 -4px 0 rgba(0,0,0,.25), 0 4px 10px -4px rgba(0,0,0,.5); background-image: radial-gradient(circle at 35% 30%, rgba(255,255,255,.45), transparent 45%); }
.ring .hole { position: absolute; left: 50px; top: 50px; width: 160px; height: 160px; border-radius: 50%; border: 2px dashed var(--line); }
.colrow { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line-2); }
.colrow input[type="color"] { width: 42px; height: 38px; padding: 2px; border: 1px solid var(--line); border-radius: 50%; background: #fffaf0; }
.colrow .rel { grid-column: 1 / -1; font-size: 13px; color: var(--ink-2); }
.colrow .about { grid-column: 1 / -1; }
.bars { display: grid; gap: 8px; }
.bars .b { display: grid; grid-template-columns: 80px minmax(0, 1fr) 90px; gap: 8px; align-items: center; font-size: 14px; }
.bars .t { height: 12px; border-radius: 6px; background: var(--panel-2); overflow: hidden; border: 1px solid var(--line-2); }
.bars .t i { display: block; height: 100%; }
.bars .v { font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); }

/* ---------- save ---------- */
.savegrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 18px; align-items: start; }
.savegrid textarea { font-family: var(--f-mono); font-size: 12px; min-height: 200px; }
fieldset { border: 1px solid var(--line); border-radius: 10px; }

<script>
(function () {
'use strict';
const STORE_KEY = 'ctd-proxies-v1';
const FORMAT = 'cut-the-deck-proxies';
const COLORLESS_HEX = '#8a8f94';
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (sel) => document.querySelector(sel);

// ---------------------------------------------------------------- starter set
function starter() {
  const K = (word, color, opposite, meaning) => ({ id: uid(), word, color, opposite, meaning });
  const C = (name, type, cost, copies, text, hp) => ({ id: uid(), name, type, cost, copies, text, hp: hp || 0, colors: [], notes: '' });
  return {
    format: FORMAT, version: 1, name: 'Base set',
    colors: [
      { id: 'black', name: 'Black', hex: '#2b2f36', about: 'Knowledge. Sees what is coming and rewrites the record.' },
      { id: 'blue', name: 'Blue', hex: '#2754b5', about: 'Order. Builds slowly and repeats reliably.' },
      { id: 'green', name: 'Green', hex: '#3f7d3a', about: 'Growth. Gets stronger over turns and heals what was spent.' },
      { id: 'red', name: 'Red', hex: '#c7392a', about: 'Force. Big hits that land on everyone and chain together.' },
      { id: 'yellow', name: 'Yellow', hex: '#d99a0b', about: 'Chaos. Cheap edits, random targets, energy now and worry later.' },
      { id: 'purple', name: 'Purple', hex: '#6a2c8a', about: 'Sacrifice. Hurts you to hurt them worse, and what it inflicts lingers.' },
    ],
    keywords: [
      K('Deal', '', 'Heal', 'Deal damage. Block absorbs it first.'),
      K('Heal', 'green', 'Deal', 'Restore HP, up to your max.'),
      K('Block', 'blue', 'Lose Block', 'Absorbs damage until your next turn.'),
      K('Lose Block', '', 'Block', 'Remove that much Block.'),
      K('Draw', 'black', 'Discard', 'Draw cards. The deck does not reshuffle mid-turn.'),
      K('Discard', '', 'Draw', 'Discard cards at random from your hand.'),
      K('Gain Energy', 'yellow', 'Lose Energy', 'Get extra energy this turn.'),
      K('Lose Energy', '', 'Gain Energy', 'Lose energy this turn.'),
      K('Apply Weak', 'purple', 'Apply Strength', 'Weak: deals 25% less damage. Goes down by 1 each turn.'),
      K('Apply Strength', 'green', 'Apply Weak', 'Strength: +1 damage per hit for each stack.'),
      K('Poison', 'purple', 'Regen', 'At the start of its turn it loses 1 HP per Poison (ignores Block), then Poison goes down by 1.'),
      K('Regen', 'green', 'Poison', 'At the start of your turn heal 1 per Regen, then Regen goes down by 1.'),
      K('Siphon', 'purple', '', 'Deal that much, then heal whatever got past Block.'),
      K('Build', 'blue', '', 'Each time you play this card, it repeats once more than last time.'),
      K('Combo', 'red', '', 'Only works if you already played an attack this turn.'),
      K('Redact', 'black', '', 'Cancel an enemy’s next attack on your cards’ text.'),
      K('to an enemy', '', 'to yourself', 'Targets one enemy you choose.'),
      K('to yourself', 'purple', 'to an enemy', 'Targets you.'),
      K('to ALL enemies', 'red', 'to an enemy', 'Hits every enemy.'),
      K('to a random enemy', 'yellow', 'to ALL enemies', 'Picks an enemy at random.'),
      K('once', '', 'twice', ''),
      K('twice', 'blue', 'once', 'Do it two times.'),
      K('three times', 'blue', 'once', 'Do it three times.'),
      K('if you have Block', 'blue', 'unless you have Block', ''),
      K('unless you have Block', 'blue', 'if you have Block', ''),
      K('if the enemy is Weak', 'purple', 'unless the enemy is Weak', ''),
      K('unless the enemy is Weak', 'purple', 'if the enemy is Weak', ''),
      K('if this is your first card', 'black', 'unless this is your first card', 'Only if you have not played a card yet this turn.'),
      K('unless this is your first card', 'black', 'if this is your first card', ''),
      K('When drawn', 'purple', 'When played', 'Happens as soon as you draw it.'),
      K('When played', '', 'When drawn', ''),
      K('At end of turn', 'green', 'When drawn', 'Happens if it is still in your hand when your turn ends.'),
      K('When pasted', 'yellow', 'When cut', 'Happens when this text is glued onto a card.'),
      K('When cut', '', 'When pasted', 'Happens when this text is cut off a card.'),
      K('Attack', '', '', 'The enemy hits you for that much.'),
      K('Black out', 'black', '', 'Mute a word and hide it.'),
      K('Typo', '', '', '±1 to a number.'),
      K('Invert', '', '', 'Flip a word to its opposite.'),
      K('Mute', '', '', 'A muted word is ignored.'),
    ],
    cards: [
      C('Strike', 'Card', '1', 5, 'Deal 6 to an enemy.'),
      C('Defend', 'Card', '1', 4, 'Block 5.'),
      C('Jab', 'Card', '1', 1, 'Deal 3 twice to an enemy.'),
      C('Reckless Swing', 'Card', '2', 0, 'Deal 9 to ALL enemies.\nDeal 6 to yourself.'),
      C('Second Wind', 'Card', '1', 0, 'When drawn: Draw 2.\nWhen drawn: Discard 2.'),
      C('Cheap Shot', 'Card', '2', 0, 'Deal 4 three times to a random enemy if this is your first card.'),
      C('Overcharge', 'Card', '1', 0, 'Gain Energy 2.\nApply Weak 2 to yourself.'),
      C('Bulwark', 'Card', '1', 0, 'Block 9.\nAt end of turn: Lose Block 4.'),
      C('Blood Price', 'Card', '1', 0, 'Draw 3.\nDeal 4 to yourself.'),
      C('Shield Bash', 'Card', '2', 0, 'Deal 8 to an enemy if you have Block.\nBlock 3.'),
      C('Venom Ink', 'Card', '1', 0, 'Poison 3 to an enemy.\nDraw 1 if the enemy is Weak.'),
      C('Leech', 'Card', '2', 0, 'Siphon 5 to an enemy.\nPoison 1 to an enemy.'),
      C('Scaffold', 'Card', '1', 0, 'Build.\nBlock 3.'),
      C('Follow-Through', 'Card', '1', 0, 'Combo: Deal 7 to an enemy.'),
      C('Retraction', 'Card', '1', 0, 'Redact.\nDraw 1.'),
      C('Cut-Up', 'Card', '1', 0, 'When pasted: Gain Energy 1.\nDeal 3 to a random enemy.'),
      C('Redactor', 'Enemy', '', 0, 'Attack 6.\nBlack out a word on a card in your hand.\nAttack 4. Block 4.', 30),
      C('Inverter', 'Enemy', '', 0, 'Invert the verb on a card in your hand.\nAttack 8.\nAttack 5. Block 5.', 34),
      C('Typo Imp', 'Enemy', '', 0, 'Attack 3. Typo a number on a card in your hand.\nAttack 5.', 14),
      C('Censor', 'Enemy', '', 0, 'Mute every number above 5 in your deck.\nAttack 10.\nAttack 6 twice.\nBlock 12. Apply Strength 2 to yourself.', 70),
      C('Plagiarist', 'Enemy', '', 0, 'Attack 12.\nBlock 10. Apply Strength 1 to yourself.\nCopy your most expensive card and play it at you.', 150),
    ],
    setup: { handSize: 5, invertPivot: 10, trackers: [{ name: 'HP', start: 60 }, { name: 'Energy', start: 3 }, { name: 'Block', start: 0 }, { name: 'Ink', start: 3 }] },
  };
}

function emptyTable() {
  return { inst: {}, zones: { deck: [], hand: [], play: [], discard: [], gone: [], enemies: [] }, clipboard: [], trackers: [], log: [], turn: 1 };
}

// ---------------------------------------------------------------- state
let data, table;
let undoStack = [];
const ui = { view: 'table', selCard: null, selTok: null, clipSel: null, editCardId: null, libFilter: 'all', libColor: '', search: '', kwSearch: '', newGame: false, enemyPick: {}, confirm: null, importMode: 'replace', includeTable: true, savedAt: null };
let downloads = null;

function normalizeData(d) {
  const base = starter();
  const out = {
    format: FORMAT, version: 1,
    name: typeof d.name === 'string' && d.name ? d.name : 'Imported set',
    colors: Array.isArray(d.colors) && d.colors.length ? d.colors.map((c, i) => ({ id: String(c.id || 'c' + i), name: String(c.name || 'Color ' + (i + 1)), hex: /^#[0-9a-f]{6}$/i.test(c.hex) ? c.hex : '#888888', about: String(c.about || '') })) : base.colors,
    keywords: Array.isArray(d.keywords) ? d.keywords.filter((k) => k && k.word).map((k) => ({ id: String(k.id || uid()), word: String(k.word), color: String(k.color || ''), opposite: String(k.opposite || ''), meaning: String(k.meaning || '') })) : [],
    cards: Array.isArray(d.cards) ? d.cards.filter((c) => c && c.name != null).map((c) => ({ id: String(c.id || uid()), name: String(c.name), type: c.type === 'Enemy' ? 'Enemy' : 'Card', cost: String(c.cost ?? ''), copies: Math.max(0, parseInt(c.copies, 10) || 0), text: String(c.text || ''), hp: Math.max(0, parseInt(c.hp, 10) || 0), colors: Array.isArray(c.colors) ? c.colors.map(String) : [], notes: String(c.notes || '') })) : [],
    setup: {
      handSize: Math.max(0, parseInt(d.setup?.handSize, 10) || 5),
      invertPivot: parseInt(d.setup?.invertPivot, 10) || 10,
      trackers: Array.isArray(d.setup?.trackers) ? d.setup.trackers.map((t) => ({ name: String(t.name || 'Counter'), start: parseInt(t.start, 10) || 0 })) : base.setup.trackers,
    },
  };
  return out;
}

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      data = normalizeData(s.data || {});
      table = s.table && s.table.zones ? s.table : null;
    }
  } catch (e) { /* storage unavailable or corrupt: start fresh */ }
  if (!data) data = starter();
  rebuildIndex();
  if (!table) { table = emptyTable(); newGame(enemyCards().slice(0, 1).map((c) => c.id), true); }
}

let saveTimer = null;
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({ data, table }));
      ui.savedAt = new Date();
      setSaveState('Saved in this browser', true);
    } catch (e) { setSaveState('Not saved: this browser blocked storage. Export a save file.', false); }
  }, 300);
}
function setSaveState(text, ok) {
  const el = $('#savestate');
  el.innerHTML = `<i style="background:${ok ? 'var(--ok)' : 'var(--danger)'}"></i><span>${esc(text)}</span>`;
}
function pushUndo() {
  undoStack.push(JSON.stringify({ data, table }));
  if (undoStack.length > 60) undoStack.shift();
}
function undo() {
  const s = undoStack.pop();
  if (!s) return toast('Nothing to undo.');
  const o = JSON.parse(s);
  data = o.data; table = o.table;
  ui.selTok = null; ui.selCard = null; ui.clipSel = null;
  rebuildIndex(); scheduleSave(); render();
}

let toastTimer = null;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
}
function logMsg(msg) {
  table.log.push(`T${table.turn} · ${msg}`);
  if (table.log.length > 80) table.log.shift();
}

// ---------------------------------------------------------------- words
let kwMap = new Map(); let phrases = []; let colorMap = new Map();
function rawTokens(line) { return line.match(/~[^~]+~|[A-Za-z0-9±+\-−’']+|[^\sA-Za-z0-9]/g) || []; }
function rebuildIndex() {
  kwMap = new Map(); colorMap = new Map();
  data.colors.forEach((c, i) => colorMap.set(c.id, { ...c, idx: i }));
  for (const k of data.keywords) if (k.word.trim()) kwMap.set(k.word.trim().toLowerCase(), k);
  phrases = [...kwMap.values()].map((k) => ({ k, toks: rawTokens(k.word.trim()).map((t) => t.toLowerCase()) })).filter((p) => p.toks.length).sort((a, b) => b.toks.length - a.toks.length);
}
function tokenize(text) {
  const lines = String(text || '').split('\n').map((line) => {
    const raw = rawTokens(line); const out = []; let i = 0;
    while (i < raw.length) {
      const t = raw[i];
      if (t.length > 2 && t[0] === '~' && t[t.length - 1] === '~') { out.push({ w: t.slice(1, -1), m: true }); i++; continue; }
      let hit = null;
      for (const p of phrases) {
        const n = p.toks.length;
        if (i + n > raw.length) continue;
        let ok = true;
        for (let j = 0; j < n; j++) if (raw[i + j].toLowerCase() !== p.toks[j]) { ok = false; break; }
        if (ok) { hit = n; break; }
      }
      if (hit) { out.push({ w: raw.slice(i, i + hit).join(' ') }); i += hit; } else { out.push({ w: t }); i++; }
    }
    return out;
  }).filter((l) => l.length);
  return lines.length ? lines : [[]];
}
const NO_SPACE_BEFORE = /^[.,:;!?)]$/;
const isPunct = (w) => /^[^\sA-Za-z0-9±~−]$/.test(w);
const isNum = (w) => /^([0-9]+|X)$/.test(w);
function joinLine(line) {
  let s = '';
  line.forEach((t, i) => {
    const text = t.m ? `~${t.w}~` : t.w;
    if (i > 0 && !NO_SPACE_BEFORE.test(t.w) && line[i - 1].w !== '(') s += ' ';
    s += text;
  });
  return s;
}
const serialize = (lines) => lines.map(joinLine).filter((l) => l.length).join('\n');
const kwOf = (w) => kwMap.get(String(w).toLowerCase());
const hexOf = (colorId) => (colorMap.get(colorId)?.hex) || COLORLESS_HEX;
function opposite(w) {
  if (w === 'X') return '1';
  if (/^[0-9]+$/.test(w)) { const n = parseInt(w, 10); const p = data.setup.invertPivot; return n <= p ? String(p - n) : null; }
  const k = kwOf(w);
  if (k && k.opposite.trim()) { const o = kwOf(k.opposite.trim()); return o ? o.word : k.opposite.trim(); }
  for (const kk of kwMap.values()) if (kk.opposite.trim().toLowerCase() === String(w).toLowerCase()) return kk.word;
  return null;
}
function colorsOfLines(lines) {
  const set = new Set();
  for (const l of lines) for (const t of l) { if (t.m) continue; const k = kwOf(t.w); if (k && colorMap.has(k.color)) set.add(k.color); }
  return [...set].sort((a, b) => colorMap.get(a).idx - colorMap.get(b).idx);
}
function cardColors(card, lines) { return card.colors && card.colors.length ? card.colors.filter((c) => colorMap.has(c)) : colorsOfLines(lines); }
function opposites(colorId) {
  const c = colorMap.get(colorId); const n = data.colors.length;
  if (!c || n < 2) return null;
  return data.colors[(c.idx + Math.floor(n / 2)) % n].id;
}

// ---------------------------------------------------------------- table ops
const cardById = (id) => data.cards.find((c) => c.id === id);
const enemyCards = () => data.cards.filter((c) => c.type === 'Enemy');
function makeInst(card) {
  const iid = 'i' + uid();
  table.inst[iid] = { iid, cardId: card.id, name: card.name, lines: tokenize(card.text), counters: card.type === 'Enemy' ? { HP: card.hp } : {}, step: 0 };
  return iid;
}
function zoneOf(iid) { for (const z in table.zones) if (table.zones[z].includes(iid)) return z; return null; }
function moveInst(iid, zone, top) {
  for (const z in table.zones) table.zones[z] = table.zones[z].filter((x) => x !== iid);
  if (top) table.zones[zone].unshift(iid); else table.zones[zone].push(iid);
}
function shuffle(a) { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }
function drawCards(n) {
  let drawn = 0;
  for (let k = 0; k < n; k++) {
    const iid = table.zones.deck.shift();
    if (!iid) break;
    table.zones.hand.push(iid); drawn++;
  }
  return drawn;
}
function resetTrackers() { table.trackers = data.setup.trackers.map((t) => ({ name: t.name, value: t.start })); }
function trackerByName(name) { return table.trackers.find((t) => t.name.toLowerCase() === name.toLowerCase()); }
function newGame(enemyIds, quiet) {
  const clip = table ? table.clipboard : [];
  table = emptyTable(); table.clipboard = clip;
  for (const c of data.cards) if (c.type !== 'Enemy') for (let k = 0; k < c.copies; k++) table.zones.deck.push(makeInst(c));
  table.zones.deck = shuffle(table.zones.deck);
  for (const id of enemyIds) { const c = cardById(id); if (c) table.zones.enemies.push(makeInst(c)); }
  resetTrackers();
  drawCards(data.setup.handSize);
  logMsg(`New game: ${table.zones.deck.length + table.zones.hand.length} cards${enemyIds.length ? ' vs ' + enemyIds.map((id) => cardById(id)?.name).filter(Boolean).join(', ') : ''}.`);
  if (!quiet) toast('New game dealt.');
}
function endTurn() {
  const n = table.zones.hand.length;
  table.zones.discard.push(...table.zones.hand); table.zones.hand = [];
  const e = trackerByName('Energy'); const se = data.setup.trackers.find((t) => t.name.toLowerCase() === 'energy');
  if (e && se) e.value = se.start;
  const b = trackerByName('Block'); if (b) b.value = 0;
  for (const iid of table.zones.enemies) { const it = table.inst[iid]; if (it) it.step = (it.step + 1) % Math.max(1, it.lines.length); }
  table.turn++;
  let shuffled = false;
  if (table.zones.deck.length < data.setup.handSize && table.zones.discard.length) {
    table.zones.deck = table.zones.deck.concat(shuffle(table.zones.discard)); table.zones.discard = []; shuffled = true;
  }
  drawCards(data.setup.handSize);
  logMsg(`Turn ${table.turn}: discarded ${n}${shuffled ? ', reshuffled' : ''}, drew ${table.zones.hand.length}.`);
}

// ---------------------------------------------------------------- word edit ops (table instance or library card)
function getLines(scope, id) { return scope === 'table' ? table.inst[id].lines : tokenize(cardById(id).text); }
function setLines(scope, id, lines) {
  const clean = lines.filter((l) => l.length);
  if (scope === 'table') table.inst[id].lines = clean.length ? clean : [[]];
  else { cardById(id).text = serialize(clean); const ta = $('#cf-text'); if (ta) ta.value = cardById(id).text; }
}
function nameOf(scope, id) { return scope === 'table' ? table.inst[id].name : cardById(id).name; }
function clipPick() { if (!table.clipboard.length) return -1; return ui.clipSel != null && ui.clipSel < table.clipboard.length ? ui.clipSel : table.clipboard.length - 1; }
function wordOp(op) {
  const s = ui.selTok; if (!s) return;
  const lines = getLines(s.scope, s.id); const line = lines[s.li]; const tok = line && line[s.ti];
  if (!tok && !['pasteend'].includes(op)) return;
  pushUndo();
  const src = nameOf(s.scope, s.id);
  if (op === 'cut' || op === 'copy') {
    table.clipboard.push({ w: tok.w, from: src });
    ui.clipSel = table.clipboard.length - 1;
    if (op === 'cut') { line.splice(s.ti, 1); ui.selTok = null; if (s.scope === 'table') logMsg(`Cut “${tok.w}” from ${src}.`); }
    else toast(`Copied “${tok.w}”.`);
  } else if (op === 'mute') {
    tok.m = !tok.m; if (s.scope === 'table') logMsg(`${tok.m ? 'Muted' : 'Unmuted'} “${tok.w}” on ${src}.`);
  } else if (op === 'invert') {
    const o = opposite(tok.w);
    if (!o) { undoStack.pop(); return toast(`“${tok.w}” has no opposite. Add one in Keywords & colors.`); }
    if (s.scope === 'table') logMsg(`Inverted “${tok.w}” → “${o}” on ${src}.`);
    tok.w = o;
  } else if (op === 'before' || op === 'after' || op === 'replace') {
    const ci = clipPick(); if (ci < 0) { undoStack.pop(); return toast('Your clipboard is empty. Cut or copy a word first.'); }
    const c = table.clipboard.splice(ci, 1)[0]; ui.clipSel = null;
    const nt = { w: c.w, from: c.from !== src ? c.from : undefined };
    if (op === 'replace') { table.clipboard.push({ w: tok.w, from: src }); line.splice(s.ti, 1, nt); }
    else { const at = op === 'before' ? s.ti : s.ti + 1; line.splice(at, 0, nt); ui.selTok = { ...s, ti: at }; }
    if (s.scope === 'table') logMsg(`Pasted “${c.w}” on ${src}.`);
  }
  setLines(s.scope, s.id, lines);
  if (ui.selTok) { const L = getLines(s.scope, s.id); if (!L[ui.selTok.li] || !L[ui.selTok.li][ui.selTok.ti]) ui.selTok = null; }
  scheduleSave(); rerender();
}
function pasteEnd(scope, id, newLine) {
  const ci = clipPick(); if (ci < 0) return toast('Your clipboard is empty. Cut or copy a word first.');
  pushUndo();
  const lines = getLines(scope, id); const c = table.clipboard.splice(ci, 1)[0]; ui.clipSel = null;
  const src = nameOf(scope, id); const nt = { w: c.w, from: c.from !== src ? c.from : undefined };
  if (newLine || !lines.length || !lines[lines.length - 1].length) lines.push([nt]);
  else { const last = lines[lines.length - 1]; const p = last.length && isPunct(last[last.length - 1].w) ? last.length - 1 : last.length; last.splice(p, 0, nt); }
  setLines(scope, id, lines);
  if (scope === 'table') logMsg(`Pasted “${c.w}” on ${src}.`);
  scheduleSave(); rerender();
}

// ---------------------------------------------------------------- render helpers
function bandStyle(cols) {
  if (!cols.length) return `background: repeating-linear-gradient(135deg, ${COLORLESS_HEX} 0 6px, #c4c7ca 6px 12px)`;
  if (cols.length === 1) return `background: ${hexOf(cols[0])}`;
  const step = 100 / cols.length;
  return 'background: linear-gradient(90deg, ' + cols.map((c, i) => `${hexOf(c)} ${i * step}% ${(i + 1) * step}%`).join(', ') + ')';
}
function frameStyle(cols, enemy) {
  if (enemy) return 'background: linear-gradient(160deg, #7a2119, #2a0c0a 70%)';
  if (!cols.length) return 'background: linear-gradient(135deg, #a7adb3, #e3e6e8 45%, #7d838a)';
  if (cols.length === 1) return `background: linear-gradient(135deg, ${hexOf(cols[0])}, ${shade(hexOf(cols[0]), -0.35)})`;
  return 'background: linear-gradient(135deg, ' + cols.map(hexOf).join(', ') + ')';
}
function shade(hex, amt) {

function importFrom(text) {
  const msg = $('#importmsg');
  let o;
  try { o = JSON.parse(text); } catch (e) { msg.textContent = 'That isn’t a save file: the text is not valid JSON.'; return; }
  const d = o && o.data ? o.data : o;
  if (!d || !Array.isArray(d.cards)) { msg.textContent = 'That file has no cards in it, so it isn’t a Cut the Deck save.'; return; }
  pushUndo();
  const inc = normalizeData(d);
  if (ui.importMode === 'replace') {
    data = inc; rebuildIndex();
    if (o.table && o.table.zones) table = o.table; else { table = emptyTable(); newGame([], true); }
    msg.textContent = `Loaded “${data.name}”: ${data.cards.length} cards, ${data.keywords.length} keywords.`;
  } else {
    const names = new Set(data.cards.map((c) => c.name.toLowerCase()));
    let nc = 0, nk = 0;
    for (const c of inc.cards) { const nc2 = { ...c, id: uid(), name: names.has(c.name.toLowerCase()) ? c.name + ' (imported)' : c.name }; data.cards.push(nc2); nc++; }
    const words = new Set(data.keywords.map((k) => k.word.toLowerCase()));
    for (const k of inc.keywords) if (!words.has(k.word.toLowerCase())) { data.keywords.push({ ...k, id: uid(), color: colorMap.has(k.color) ? k.color : '' }); nk++; }
    rebuildIndex();
    msg.textContent = `Added ${nc} cards and ${nk} new keywords. Keywords you already had were kept as yours.`;
  }
  scheduleSave(); toast('Save file loaded.');
}

// ---------------------------------------------------------------- events
document.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-act]');
  if (!b) { const c = e.target.closest('.card[data-id]'); if (c && c.dataset.scope === 'table' && !e.target.closest('button, input')) { ui.selCard = c.dataset.id; ui.selTok = null; render(); } return; }
  const a = b.dataset.act; const id = b.dataset.id;
  if (a !== 'libdel' && a !== 'reset' && a !== 'kwdel') ui.confirm = null;
  switch (a) {
    case 'tok': {
      const s = { scope: b.dataset.scope, id, li: +b.dataset.li, ti: +b.dataset.ti };
      const same = ui.selTok && ui.selTok.scope === s.scope && ui.selTok.id === s.id && ui.selTok.li === s.li && ui.selTok.ti === s.ti;
      ui.selTok = same ? null : s; if (s.scope === 'table') ui.selCard = id;
      rerender(); break;
    }
    case 'selcard': if (b.dataset.scope === 'table') { ui.selCard = ui.selCard === id ? null : id; ui.selTok = null; render(); } break;
    case 'deselect': ui.selTok = null; ui.selCard = null; rerender(); break;
    case 'w': wordOp(b.dataset.op); break;
    case 'clip': ui.clipSel = ui.clipSel === +b.dataset.i ? null : +b.dataset.i; rerender(); break;
    case 'clipdel': pushUndo(); table.clipboard.splice(+b.dataset.i, 1); ui.clipSel = null; scheduleSave(); rerender(); break;
    case 'clipclear': pushUndo(); table.clipboard = []; ui.clipSel = null; scheduleSave(); rerender(); break;
    case 'pasteend': pasteEnd('table', id, false); break;
    case 'pasteline': pasteEnd('table', id, true); break;
    case 'libpasteend': pasteEnd('lib', ui.editCardId, false); break;
    case 'libpasteline': pasteEnd('lib', ui.editCardId, true); break;
    case 'move': pushUndo(); moveInst(id, b.dataset.zone, !!b.dataset.top); logMsg(`${table.inst[id].name} → ${b.dataset.zone === 'gone' ? 'removed' : b.dataset.zone}.`); if (b.dataset.zone !== 'hand' && b.dataset.zone !== 'play' && b.dataset.zone !== 'enemies') { ui.selCard = null; ui.selTok = null; } scheduleSave(); render(); break;
    case 'tohand': pushUndo(); moveInst(id, 'hand'); scheduleSave(); render(); break;
    case 'ctr': { pushUndo(); const it = table.inst[id]; it.counters[b.dataset.name] = (it.counters[b.dataset.name] || 0) + (+b.dataset.d); scheduleSave(); render(); break; }
    case 'ctrdel': pushUndo(); delete table.inst[id].counters[b.dataset.name]; scheduleSave(); render(); break;
    case 'resettext': { pushUndo(); const it = table.inst[id]; const c = cardById(it.cardId); if (c) { it.lines = tokenize(c.text); it.name = c.name; } ui.selTok = null; scheduleSave(); render(); break; }
    case 'savetext': { const it = table.inst[id]; const c = cardById(it.cardId); if (!c) { toast('That card is no longer in the library.'); break; } pushUndo(); c.text = serialize(it.lines); scheduleSave(); toast(`Saved this text to ${c.name} in the library.`); break; }
    case 'trk': pushUndo(); table.trackers[+b.dataset.i].value += +b.dataset.d; scheduleSave(); render(); break;
    case 'step': { const it = table.inst[id]; const n = Math.max(1, it.lines.length); it.step = (it.step + (+b.dataset.d) + n) % n; scheduleSave(); render(); break; }
    case 'draw': { pushUndo(); const n = drawCards(1); if (!n) { undoStack.pop(); toast('Your deck is empty. Shuffle your discard pile into it first.'); break; } scheduleSave(); render(); break; }
    case 'shuffle': pushUndo(); table.zones.deck = shuffle(table.zones.deck); logMsg('Shuffled the deck.'); scheduleSave(); render(); toast('Deck shuffled.'); break;
    case 'reshuffle': pushUndo(); table.zones.deck = table.zones.deck.concat(shuffle(table.zones.discard)); table.zones.discard = []; logMsg('Shuffled the discard pile into the deck.'); scheduleSave(); render(); break;

    case 'libnew': { pushUndo(); const c = { id: uid(), name: 'New card', type: ui.libFilter === 'Enemy' ? 'Enemy' : 'Card', cost: '1', copies: 0, text: 'Deal 5 to an enemy.', hp: 20, colors: [], notes: '' }; data.cards.unshift(c); ui.editCardId = c.id; ui.search = ''; scheduleSave(); render(); setTimeout(() => { const n = $('#cf-name'); if (n) { n.focus(); n.select(); } }, 0); break; }

    case 'libauto': { const c = cardById(ui.editCardId); pushUndo(); c.colors = []; scheduleSave(); $('#libform').innerHTML = libFormHTML(); renderLibList(); renderLibPreview(); break; }
    case 'libcol': { const c = cardById(ui.editCardId); pushUndo(); const col = b.dataset.c; if (!c.colors.length) c.colors = colorsOfLines(tokenize(c.text)); c.colors = c.colors.includes(col) ? c.colors.filter((x) => x !== col) : [...c.colors, col]; scheduleSave(); $('#libform').innerHTML = libFormHTML(); renderLibList(); renderLibPreview(); break; }
    case 'kwfrom': { e.preventDefault(); pushUndo(); for (const w of (b.dataset.words || '').split('|')) if (w && !kwOf(w)) data.keywords.unshift({ id: uid(), word: w, color: '', opposite: '', meaning: '' }); rebuildIndex(); scheduleSave(); location.hash = 'keywords'; break; }
    // keywords
    case 'kwadd': pushUndo(); data.keywords.unshift({ id: uid(), word: 'New keyword', color: '', opposite: '', meaning: '' }); ui.kwSearch = ''; rebuildIndex(); scheduleSave(); render(); setTimeout(() => { const n = document.querySelector('[data-kf="word"]'); if (n) { n.focus(); n.select(); } }, 0); break;
    case 'kwdel': { if (ui.confirm !== 'kw:' + id) { ui.confirm = 'kw:' + id; $('#kwtable').innerHTML = kwTableHTML(); break; } pushUndo(); data.keywords = data.keywords.filter((k) => k.id !== id); ui.confirm = null; rebuildIndex(); scheduleSave(); $('#kwtable').innerHTML = kwTableHTML(); $('#health').innerHTML = healthHTML(); break; }
    case 'colup': case 'coldown': { const i = +b.dataset.i; const j = a === 'colup' ? i - 1 : i + 1; if (j < 0 || j >= data.colors.length) break; pushUndo(); [data.colors[i], data.colors[j]] = [data.colors[j], data.colors[i]]; rebuildIndex(); scheduleSave(); render(); break; }
    case 'trkadd': pushUndo(); data.setup.trackers.push({ name: 'Counter', start: 0 }); scheduleSave(); render(); break;
    case 'trkdel': pushUndo(); data.setup.trackers.splice(+b.dataset.i, 1); scheduleSave(); render(); break;
    // save
    case 'export': {
      try { await downloads.save({ filename: (data.name || 'cut-the-deck').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-').toLowerCase() + '.json', data: JSON.stringify(exportObj(), null, 2) }); toast('Save file downloaded.'); }
      catch (err) { if (err && err.code === 'declined') toast('Download cancelled.'); else toast('Download isn’t available here. Use Copy save as text.'); }
      break;
    }
    case 'copyjson': {
      const text = JSON.stringify(exportObj(), null, 2);
      try { await navigator.clipboard.writeText(text); toast('Copied. Paste it into a file or a message.'); }
      catch (err) { const ta = $('#exportjson'); ta.value = text; ta.focus(); ta.select(); toast('Press Ctrl+C or ⌘C to copy the selected text.'); }
      break;
    }
    case 'importload': { const t = $('#importtext').value.trim(); if (!t) { $('#importmsg').textContent = 'Pick a file or paste a save first.'; break; } importFrom(t); break; }
    case 'reset': { if (ui.confirm !== 'reset') { ui.confirm = 'reset'; render(); break; } pushUndo(); data = starter(); rebuildIndex(); table = emptyTable(); newGame(enemyCards().slice(0, 1).map((c) => c.id), true); ui.confirm = null; scheduleSave(); render(); toast('Starter set restored. Undo is on the Table tab.'); break; }
  }
});

document.addEventListener('submit', (e) => {
  const f = e.target.closest('[data-form]'); if (!f) return;
  e.preventDefault();
  if (f.dataset.form === 'writeword') {
    const v = $('#writeword').value.trim(); if (!v) return;
    pushUndo(); const k = kwOf(v); table.clipboard.push({ w: k ? k.word : v }); ui.clipSel = table.clipboard.length - 1; scheduleSave(); render();
    const n = $('#writeword'); if (n) n.focus();
  } else if (f.dataset.form === 'addctr') {
    const v = $('#ctrname').value.trim(); const id = ui.selCard; if (!v || !id) return;
    pushUndo(); const k = kwOf(v); const name = k ? k.word : v; const it = table.inst[id]; it.counters[name] = (it.counters[name] || 0) + 1; scheduleSave(); render();
  }
});

let editingUndoArmed = false;
document.addEventListener('focusin', (e) => { if (e.target.matches('[data-cf],[data-kf],[data-colf],[data-sf],[data-tf],[data-bind]')) editingUndoArmed = true; });
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.matches('[data-cf],[data-kf],[data-colf],[data-sf],[data-tf],[data-bind]') && editingUndoArmed) { pushUndo(); editingUndoArmed = false; }
  if (t.dataset.bind === 'name') { data.name = t.value; scheduleSave(); return; }
  if (t.dataset.ui) { ui[t.dataset.ui] = t.value; if (t.dataset.ui === 'search') renderLibList(); else $('#kwtable').innerHTML = kwTableHTML(); return; }
  if (t.dataset.cf) {
    const c = cardById(ui.editCardId); if (!c) return; const f = t.dataset.cf;
    if (f === 'copies' || f === 'hp') c[f] = Math.max(0, parseInt(t.value, 10) || 0);
    else c[f] = t.value;
    scheduleSave();
    if (f === 'type') { $('#libform').innerHTML = libFormHTML(); }
    renderLibList(); renderLibPreview(); return;
  }
  if (t.dataset.kf) {
    const k = data.keywords.find((x) => x.id === t.dataset.id); if (!k) return; k[t.dataset.kf] = t.value;
    if (t.dataset.kf === 'color') t.style.borderLeft = `6px solid ${hexOf(k.color)}`;
    rebuildIndex(); scheduleSave(); $('#health').innerHTML = healthHTML(); return;
  }
  if (t.dataset.colf) {
    const c = data.colors.find((x) => x.id === t.dataset.id); if (!c) return; c[t.dataset.colf] = t.value;
    rebuildIndex(); scheduleSave(); $('#ring').innerHTML = ringHTML(); $('#health').innerHTML = healthHTML();
    document.querySelectorAll('#colorlist .rel').forEach((el, i) => { el.innerHTML = relText(i); }); return;
  }
  if (t.dataset.sf) { data.setup[t.dataset.sf] = parseInt(t.value, 10) || 0; scheduleSave(); return; }
  if (t.dataset.tf) { const tr = data.setup.trackers[+t.dataset.i]; if (t.dataset.tf === 'start') tr.start = parseInt(t.value, 10) || 0; else tr.name = t.value; scheduleSave(); return; }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset.pick) { ui.enemyPick[t.dataset.pick] = t.checked; return; }
  if (t.dataset.uiCheck) { ui[t.dataset.uiCheck] = t.checked; $('#exportjson').value = JSON.stringify(exportObj(), null, 2); return; }
  if (t.dataset.imode) { ui.importMode = t.dataset.imode; return; }
  if (t.id === 'importfile' && t.files && t.files[0]) {
    const r = new FileReader();
    r.onload = () => { $('#importtext').value = String(r.result || ''); $('#importmsg').textContent = `Read ${t.files[0].name}. Press Load.`; };
    r.onerror = () => { $('#importmsg').textContent = 'Could not read that file.'; };
    r.readAsText(t.files[0]);
  }
  if (t.dataset.kf === 'word' || t.dataset.kf === 'opposite') { $('#kwtable').innerHTML = kwTableHTML(); }
});

// drag and drop between zones (desktop)
document.addEventListener('dragstart', (e) => { const c = e.target.closest && e.target.closest('.card[draggable="true"]'); if (!c) return; e.dataTransfer.setData('text/plain', c.dataset.id); e.dataTransfer.effectAllowed = 'move'; });
document.addEventListener('dragover', (e) => { const z = e.target.closest && e.target.closest('[data-zone]'); if (!z || ui.view !== 'table') return; e.preventDefault(); z.classList.add('over'); });
document.addEventListener('dragleave', (e) => { const z = e.target.closest && e.target.closest('[data-zone]'); if (z && !z.contains(e.relatedTarget)) z.classList.remove('over'); });
document.addEventListener('drop', (e) => {
  const z = e.target.closest && e.target.closest('[data-zone]'); if (!z) return; e.preventDefault();
  const iid = e.dataTransfer.getData('text/plain'); if (!table.inst[iid]) return;
  pushUndo(); moveInst(iid, z.dataset.zone, z.dataset.zone === 'deck'); logMsg(`${table.inst[iid].name} → ${z.dataset.zone === 'gone' ? 'removed' : z.dataset.zone}.`); scheduleSave(); render();
});

document.addEventListener('keydown', (e) => {
  const typing = e.target.matches('input, textarea, select');
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !typing) { e.preventDefault(); undo(); }
  else if (e.key === 'Escape') { ui.selTok = null; ui.selCard = null; ui.clipSel = null; rerender(); }
});

function route() {
  const v = (location.hash || '#table').slice(1);
  ui.view = ['table', 'cards', 'keywords', 'save'].includes(v) ? v : 'table';
  ui.selTok = null; ui.selCard = null; ui.confirm = null;
  render();
}
window.addEventListener('hashchange', route);

load();
route();
setSaveState('Saved in this browser', true);
(async () => {
  try {
    if (window.claude && window.claude.use) downloads = await window.claude.use('downloads');
    else downloads = {
      // On the plain website a normal file download works.
      save: async ({ filename, data: body }) => {
        const url = URL.createObjectURL(new Blob([body], { type: 'application/json' }));
        const a = document.createElement('a'); a.href = url; a.download = filename;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        return { status: 'saved' };
      },
    };
    if (downloads && ui.view === 'save') render();
  } catch (e) { downloads = null; }
})();
})();
</script>

</body>
</html>
